<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReaLearnings - Earn</title><style>body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center}#top{padding:14px;background:#1e1e1e;display:flex;justify-content:space-between;font-weight:bold;border-bottom:2px solid #00ff88}#tabs{display:flex;gap:6px;padding:10px;background:#181818}.tab{flex:1;padding:14px;background:#333;border-radius:10px;font-weight:bold}.tab.active{background:#00ff88;color:#000}#game{position:relative;width:100%;height:55vh;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center}.fruit{position:absolute;font-size:50px}button.main{background:#00ff88;color:#000;padding:16px 40px;border:none;border-radius:12px;font-size:18px;font-weight:bold;margin-top:12px}.boxes{display:flex;gap:15px}.box{width:85px;height:85px;background:linear-gradient(#ffcc00,#ff9900);border-radius:15px;font-size:45px;display:flex;align-items:center;justify-content:center;border:3px solid #fff}#spinWheel{width:180px;height:180px;border-radius:50%;border:6px solid #00ff88;background:conic-gradient(red,yellow,lime,blue);transition:transform 3s}#wd{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:99}.card{background:#1e1e1e;padding:20px;border-radius:15px;width:90%;max-width:350px}input,select{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:none}</style></head><body><div id="top"><div>Bal: $<span id="bal">0.000</span></div><div>3 Games</div></div><div id="tabs"><div class="tab active" onclick="showGame(1)">🍎 SLASH</div><div class="tab" onclick="showGame(2)">🎡 SPIN</div><div class="tab" onclick="showGame(3)">🎁 BOXES</div></div><div id="game"></div><button class="main" onclick="openWD()">WITHDRAW</button><div id="wd"><div class="card"><h3>Withdraw</h3><p>Balance: $<span id="wBal">0.000</span></p><select id="coin"><option value="TON">TON (Native)</option><option value="USDT-TON" selected>USDT (TON Network)</option></select><input id="tonAddr" placeholder="TON Address: UQ... / EQ..."><input id="tonAmt" type="number" placeholder="Amount $ (Min $1)"><button class="main" onclick="doWD()">CONFIRM</button><button class="main" style="background:#333;color:#fff;margin-top:10px" onclick="closeWD()">CANCEL</button><p id="wdMsg" style="color:#00ff88"></p></div></div><script>let bal=0;const rw=0.001;let cg=1,gi;function showGame(n){cg=n;document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i+1==n));clearInterval(gi);document.getElementById('game').innerHTML='';if(n==1)ss();if(n==2)sp();if(n==3)sb();}function addR(){bal+=rw;document.getElementById('bal').innerText=bal.toFixed(3);document.getElementById('wBal').innerText=bal.toFixed(3);}function ss(){document.getElementById('game').innerHTML='<p>Tap fruits!</p>';function spawn(){if(cg!=1)return;let f=document.createElement('div');f.className='fruit';f.innerText=['🍎','🍉','🍊','🍓'][Math.floor(Math.random()*4)];f.style.left=Math.random()*80+'%';f.style.top='-50px';document.getElementById('game').appendChild(f);let top=0;let fall=setInterval(()=>{top+=4;f.style.top=top+'px';if(top>500){clearInterval(fall);f.remove();}},30);f.onclick=()=>{clearInterval(fall);addR();f.remove();}}gi=setInterval(spawn,800);}function sp(){document.getElementById('game').innerHTML='<div id="spinWheel"></div><button class="main" style="margin-top:20px" onclick="ds()">SPIN NOW</button><p id="sr"></p>';}function ds(){let w=document.getElementById('spinWheel');w.style.transform='rotate('+(1080+Math.random()*1440)+'deg)';setTimeout(()=>{addR();document.getElementById('sr').innerText='Won!';},3000);}function sb(){document.getElementById('game').innerHTML='<div class="boxes"><div class="box" onclick="ob(this)">🎁</div><div class="box" onclick="ob(this)">🎁</div><div class="box" onclick="ob(this)">🎁</div></div><p id="br"></p>';}function ob(el){if(el.innerText!='🎁')return;el.innerText=Math.random()>0.3?'💰':'💨';if(el.innerText=='💰'){addR();}setTimeout(()=>{if(cg==3)sb();},1000);}function openWD(){document.getElementById('wd').style.display='flex';}function closeWD(){document.getElementById('wd').style.display='none';}function doWD(){let c=document.getElementById('coin').value;let a=document.getElementById('tonAddr').value;let m=parseFloat(document.getElementById('tonAmt').value);if(!a||a.length<10){document.getElementById('wdMsg').innerText='Enter valid TON address UQ...';return;}if(m>bal||m<1||isNaN(m)){document.getElementById('wdMsg').innerText='Min $1, Max $'+bal.toFixed(3);return;}document.getElementById('wdMsg').innerText='✅ $'+m+' '+c+' to '+a.slice(0,8)+'... Pending 24hrs';bal-=m;document.getElementById('bal').innerText=bal.toFixed(3);}showGame(1);</script></body></html>
