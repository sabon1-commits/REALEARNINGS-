
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REALEARNINGSNOW</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;margin:0}#top{display:flex;justify-content:space-around;padding:12px;background:#111;border-bottom:2px solid #0f0}#board{width:340px;height:400px;margin:10px auto;background:#1a1a1a;position:relative;border-radius:15px;border:2px solid #333;overflow:hidden;touch-action:none}.fruit{position:absolute;width:54px;height:54px;background:#2a2a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}.fruit.same{border-color:yellow;box-shadow:0 0 12px yellow}.fruit.drag{transform:scale(1.3);z-index:100}.btn{width:92%;padding:13px;border-radius:12px;border:none;font-weight:bold;margin:5px}.box{background:#111;border:2px solid #0f0;border-radius:15px;margin:10px;padding:12px}input{width:92%;padding:10px;border-radius:8px;background:#222;color:#fff;border:1px solid #333}</style></head><body>
<div id="top"><div>🔀 <span id="mergeEl">0</span>/50</div><div>💵 $<span id="usdEl">0.00</span></div></div>
<div style="font-size:11px;padding:6px">REALEARNINGSNOW - Drag same fruits to merge | 50 merges = $0.25</div>
<div id="board"></div>
<button class="btn" style="background:#0f0;color:#000" onclick="addFruit()">➕ ADD FRUIT</button>
<button class="btn" style="background:#333;color:#fff" onclick="showTask()">📋 TASK +5</button>
<div class="box"><h3 style="text-align:center">💸 REALEARNINGSNOW</h3><input id="tonAddr" placeholder="TON Address UQ..."><button class="btn" style="background:#333;color:#fff;margin-top:8px" onclick="saveW()">💾 Save Wallet</button><button class="btn" style="background:#0f0;color:#000" onclick="withdraw()">Withdraw REALEARNINGSNOW $0.25</button><p id="status" style="text-align:center;color:#0f0">REALEARNINGSNOW Active</p><p style="font-size:9px;text-align:center;word-break:break-all" id="refLink"></p></div>
<script>
const AdController = window.Adsgram.init({ blockId: "int-13153" });
let types=[{e:'🍒'},{e:'🍓'},{e:'🍇'},{e:'🍊'},{e:'🍎'},{e:'🍐'},{e:'🍑'},{e:'🍍'},{e:'🍈'},{e:'🍉'}];
let board=document.getElementById('board'),fruits=[],merges=parseInt(localStorage.getItem('merges_snow')||'0');
document.getElementById('mergeEl').innerText=merges;document.getElementById('usdEl').innerText=(merges*0.005).toFixed(2);
document.getElementById('tonAddr').value=localStorage.getItem('tonAddr')||'';
let uid=window.Telegram?.WebApp?.initDataUnsafe?.user?.id||'';document.getElementById('refLink').innerText='https://t.me/REALEARNINGSNOW_BOT/app?startapp='+uid;
function createFruit(x,y,t){let el=document.createElement('div');el.className='fruit';el.innerText=types[t].e;el.style.left=x+'px';el.style.top=y+'px';let obj={el,x,y,t};let sx,sy;function start(e){obj.drag=true;el.classList.add('drag');let p=e.touches?e.touches[0]:e;sx=p.clientX-x;sy=p.clientY-y;highlight(t);}function move(e){if(!obj.drag)return;let p=e.touches?e.touches[0]:e;obj.x=p.clientX-sx;obj.y=p.clientY-sy;obj.x=Math.max(0,Math.min(286,obj.x));obj.y=Math.max(0,Math.min(346,obj.y));el.style.left=obj.x+'px';el.style.top=obj.y+'px';}function end(){obj.drag=false;el.classList.remove('drag');clearHighlight();fruits.forEach(o=>{if(o===obj)return;if(Math.hypot(obj.x-o.x,obj.y-o.y)<50&&o.t===obj.t&&o.t<9){merges++;localStorage.setItem('merges_snow',merges);document.getElementById('mergeEl').innerText=merges;document.getElementById('usdEl').innerText=(merges*0.005).toFixed(2);o.t++;o.el.innerText=types[o.t].e;o.el.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:200});el.remove();fruits=fruits.filter(f=>f!==obj);if(merges%5===0)AdController.show().catch(()=>{});if(merges>=50)document.getElementById('status').innerText='✅ REALEARNINGSNOW 50 DONE! Withdraw $0.25';}});}el.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);el.addEventListener('touchstart',start,{passive:false});window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',end);board.appendChild(el);fruits.push(obj);}function highlight(t){fruits.forEach(f=>{if(f.t===t)f.el.classList.add('same');});}function clearHighlight(){fruits.forEach(f=>f.el.classList.remove('same'));}function addFruit(){AdController.show().then(()=>{createFruit(Math.random()*260,Math.random()*300,Math.floor(Math.random()*3));}).catch(()=>{createFruit(Math.random()*260,Math.random()*300,Math.floor(Math.random()*3));});}function showTask(){AdController.show().then(()=>{merges+=5;localStorage.setItem('merges_snow',merges);document.getElementById('mergeEl').innerText=merges;document.getElementById('usdEl').innerText=(merges*0.005).toFixed(2);});}function saveW(){let a=document.getElementById('tonAddr').value.trim();if(a.length<20){alert('short');return;}localStorage.setItem('tonAddr',a);document.getElementById('status').innerText='✅ REALEARNINGSNOW Wallet Saved';}function withdraw(){if(merges<50){alert('Need 50 merges for REALEARNINGSNOW');return;}let addr=localStorage.getItem('tonAddr');if(!addr){alert('Save wallet');return;}let user=window.Telegram?.WebApp?.initDataUnsafe?.user;fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addr,merges,usd:0.25,project:'REALEARNINGSNOW',user})}).then(r=>r.json()).then(j=>{document.getElementById('status').innerText='✅ REALEARNINGSNOW $0.25 Sent!';merges=0;localStorage.setItem('merges_snow',0);});}for(let i=0;i<8;i++)createFruit(Math.random()*260,Math.random()*300,Math.floor(Math.random()*2));
</script></body></html>
